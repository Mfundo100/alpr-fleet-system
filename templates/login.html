<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - ALPR Fleet System</title>
  <meta name="theme-color" content="#0f2540">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark big">AL</div>
      <h1>ALPR Fleet System</h1>
      <p>Kingdom of Eswatini - Government Vehicle Monitoring</p>
    </div>
    <form id="loginForm">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="error" hidden></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p class="login-foot">Default: <code>admin</code> / <code>Admin@1234</code></p>
  </div>
  <script src="/static/js/common.js"></script>
  <script>
    var form = document.getElementById('loginForm');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('loginError');
      err.hidden = true;
      try {
        var fd = new FormData(form);
        await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify(Object.fromEntries(fd)),
        });
        window.location.href = '/dashboard';
      } catch (ex) {
        err.textContent = ex.message || 'Login failed';
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
